# Push-time secret scan: the server-side backstop for the pre-commit hook
# (which `git commit --no-verify` skips). Scans only the commits in each push or
# PR, with .infisical-scan.toml rules; findings are redacted in the log.
# Source: vizion-security/config/github-secret-scan.yml, copied to every repo by
# vizion-security/scripts/install_scan_hooks.sh. Needs no secrets.
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="-1"
          else range="$BEFORE..$HEAD_SHA"; fi
          infisical scan --redact --telemetry=false --log-opts="$range"
